<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal e-Banca</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23fdda24'/><g fill='%23000' transform='skewX(14)'><rect x='9' y='7' width='7' height='3'/><rect x='6' y='14' width='13' height='3'/><rect x='9' y='21' width='7' height='3'/></g></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Open Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1a1b1a;background:#fff;display:flex;justify-content:center;min-height:100vh}
main{width:100%;max-width:560px;padding:0 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;padding:22px 6px 18px}
.brand svg{height:27px;width:auto;display:block}
.dots{display:flex;flex-direction:column;gap:4px;padding:6px;cursor:pointer}
.dots i{width:4px;height:4px;border-radius:50%;background:#1a1b1a;display:block}
.eb{display:flex;align-items:center;justify-content:center;gap:9px;background:#fdda24;color:#1a1b1a;font-weight:700;font-size:14px;letter-spacing:.4px;padding:15px 20px;border-radius:999px;text-decoration:none;margin:0 6px 20px}
.eb svg{width:17px;height:17px;fill:none;stroke:#1a1b1a;stroke-width:1.7}
.banner{background:#f0864a;border-radius:2px;padding:14px;position:relative}
.foto{border-radius:2px;overflow:hidden;background:linear-gradient(160deg,#7fb2e5,#4a7fb5 45%,#2f5d8a)}
.foto img{width:100%;height:auto;display:block}
.cta{display:block;text-align:center;background:#fdda24;color:#1a1b1a;font-weight:700;font-size:14px;letter-spacing:.4px;padding:16px;border-radius:999px;text-decoration:none;margin:26px 6px 0}
.chat{position:fixed;right:18px;bottom:18px;width:52px;height:52px;border-radius:50%;background:#fff;border:2px solid #fdda24;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.chat svg{width:24px;height:24px;fill:none;stroke:#1a1b1a;stroke-width:1.6}
@media(min-width:701px){
main{max-width:620px;padding-top:8px}
.eb{font-size:15px;padding:16px}
}
</style>
</head>
<body>
<main>

<header>
<a href="#" class="brand"><svg viewBox="0 0 190 30"><g transform="skewX(14)" fill="#1a1b1a"><rect x="10" y="3" width="10" height="5"/><rect x="4" y="12" width="21" height="5"/><rect x="10" y="21" width="10" height="5"/></g><text x="36" y="22" font-size="17" font-weight="800" letter-spacing="-.5" font-family="Open Sans,Arial" fill="#1a1b1a">Bancoagrícola</text></svg></a>
<div class="dots"><i></i><i></i><i></i></div>
</header>

<a class="eb" href="../">
E-BANCA PERSONAS
<svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
</a>

<div class="banner">
<div class="foto">
<img src="foto.jpg" alt="" onerror="this.style.display='none'">
</div>
<a class="cta" href="#">QUIERO MI CUENTA</a>
</div>

<div class="chat"><svg viewBox="0 0 24 24"><path d="M4 13a8 8 0 1 1 3 6.2L4 20l1-4"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/></svg></div>

</main>
</body>
</html>
